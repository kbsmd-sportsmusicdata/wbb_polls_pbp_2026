
name: Scrape Women's Basketball Data (All Sources)

on:
  schedule:
    - cron: '0 17 * * 2,6'  # 9:00 AM PST every Tuesday and Saturday
  workflow_dispatch:       # Allows manual run via GitHub UI

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SportsRef polls/standings scraper
        run: python sportsref_scraper.py

      - name: Run SportsRef ratings scraper
        run: python scrape_ratings.py

      - name: Run Team Box Score scraper
        run: python scrape_teambox.py

      - name: Run NET rankings scraper
        run: python scrape_net_rankings.py

      - name: Generate analytics table
        run: python generate_analytics_table.py

      - name: Filter schedule to Top 50 teams
        run: python filter_schedule.py

      - name: Update Google Sheets
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python update_sheets.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # Add the entire data directory (includes all scraped data and analytics)
          git add data

          # Check if there are actual changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update WBB data and analytics [CI]"
            git push
          else
            echo "No changes to commit"
          fi
